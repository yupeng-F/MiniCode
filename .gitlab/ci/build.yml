# Sprint 11 — GitLab CI: build + promote stages (2 jobs)
# 设计依据：sprint-11-gitlab-ci-design.md §3.1 #4, #6 / §4.3.1 / §5.4 / §6.2
# 上游 GH 来源：.github/workflows/build-image.yml / promote.yml
#
# 本文件 job：
#   - build-image（push develop / web 触发；docker save 产 dev tar；artifact 7 days）
#   - promote-test（manual / schedule；environment.name=test；artifact 14 days）
#
# 共享 dind 模板由 .gitlab-ci.yml#.docker-dind 提供（image: docker:24 + services dind）

build-image:
  stage: build
  extends: .docker-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
  variables:
    TAG: "dev-${CI_COMMIT_SHORT_SHA}"
  script:
    # design §4.3.1 + Sprint 12 T-01：build-artifact.mjs 内置 --save-tar，省去 docker save 两次
    - node scripts/build-artifact.mjs --tag "dev-${CI_COMMIT_SHORT_SHA}" --save-tar --out .
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - "${HARNESS_IMAGE_REPO_API}-dev-${CI_COMMIT_SHORT_SHA}.tar"
      - "${HARNESS_IMAGE_REPO_WEB}-dev-${CI_COMMIT_SHORT_SHA}.tar"
      # T-03 追加：build-artifact.mjs 输出的镜像元数据（< 1KB），便于 audit / debug
      - "image-meta.json"

# promote-test：design §6.2 设 environment.name=test
# 触发：UI Run pipeline (web) 手填变量 / Pipeline Schedule (schedule)
promote-test:
  stage: promote
  extends: .docker-dind
  environment:
    name: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
  variables:
    SPRINTS: ""
    TRAIN_MODE: "false"
  script:
    # design §3.3 实施要求：每个 manual job 第一步打印输入变量
    - 'echo "inputs: SPRINTS=$SPRINTS  TRAIN_MODE=$TRAIN_MODE  source=$CI_PIPELINE_SOURCE"'
    - node scripts/env-check.mjs check test
    - git config user.name "harness-promote"
    - git config user.email "harness-promote@users.noreply.github.com"
    - |
      ARGS="test"
      if [ -n "$SPRINTS" ]; then
        ARGS="$ARGS --sprints $SPRINTS"
      fi
      if [ "$TRAIN_MODE" = "true" ] || [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        ARGS="$ARGS --train"
      fi
      node scripts/promote.mjs $ARGS
  after_script:
    # 失败时尝试释放 test 锁（与 GH promote.yml 行为对齐）
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        OWNER=$(node scripts/lock.mjs owner test || echo '')
        case "$OWNER" in
          promote-*) node scripts/lock.mjs release test --owner "$OWNER" ;;
          *) echo "test lock is not owned by promote flow" ;;
        esac
      fi
  artifacts:
    when: on_success
    expire_in: 14 days
    paths:
      - "${HARNESS_IMAGE_REPO_API}-test-*.tar"
      - "${HARNESS_IMAGE_REPO_WEB}-test-*.tar"
