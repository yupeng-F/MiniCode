# H-04: Build Image — develop push 后构建 dev-<sha> 镜像，作为后续 promote 的源
# Harness Engineering CICD.md Build Once Deploy Many
#
# 触发：
#   - push:develop（每个 sprint 合入后构建一次）
#   - workflow_dispatch（手动 rebuild）
#
# 产物：ghcr.io/<repo>:dev-<sha>。staging.yml 与 release/* 流水线 retag 此镜像。

name: Build Image

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  HARNESS_IMAGE_REPO: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build dev-<sha>
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Resolve tag
        id: tag
        run: echo "tag=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.HARNESS_IMAGE_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ env.HARNESS_IMAGE_REPO }}:dev-latest
          labels: |
            org.harness.commit=${{ github.sha }}
            org.harness.branch=${{ github.ref_name }}
            org.harness.built-at=${{ github.event.head_commit.timestamp }}
          cache-from: type=registry,ref=${{ env.HARNESS_IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.HARNESS_IMAGE_REPO }}:buildcache,mode=max
