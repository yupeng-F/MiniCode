[project]
name = "minicode"
version = "0.1.0"
description = "A local-first agentic coding assistant with a tool-use loop and harness runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "mypy>=1.11.0",
    "pytest>=7.4.0",
    "ruff>=0.6.0",
]

[project.scripts]
minicode = "minicode.interfaces.cli:main"
minicode-web = "minicode.interfaces.web.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
