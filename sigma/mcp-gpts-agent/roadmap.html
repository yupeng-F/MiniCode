<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习路线图：MCP 与 GPTs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 40px 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 8px; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: #94a3b8; margin-bottom: 32px; font-size: 14px; }
  .concept { display: flex; align-items: center; gap: 16px; padding: 16px 20px; margin-bottom: 12px; border-radius: 12px; transition: all 0.3s; position: relative; }
  .concept .num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .concept .info { flex: 1; }
  .concept .title { font-weight: 600; font-size: 15px; }
  .concept .desc { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .concept .score { font-size: 13px; font-weight: 600; color: #64748b; }
  .not-started { background: #1e293b; border: 1px solid #334155; }
  .not-started .num { background: #334155; color: #64748b; }
  .in-progress { background: #1e3a5f; border: 1px solid #3b82f6; }
  .in-progress .num { background: #3b82f6; color: #fff; }
  .in-progress::after { content: ''; width: 8px; height: 8px; background: #3b82f6; border-radius: 50%; position: absolute; right: 16px; animation: pulse 1.5s infinite; }
  .mastered { background: #064e3b; border: 1px solid #10b981; }
  .mastered .num { background: #10b981; color: #fff; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .progress-bar { height: 4px; background: #1e293b; border-radius: 2px; margin: 24px 0; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #10b981); border-radius: 2px; transition: width 0.5s; }
</style>
</head>
<body>
<div class="container">
  <h1>MCP 与 GPTs 在 Agent 中的概念</h1>
  <p class="subtitle">已诊断：中级水平（了解 LLM、RAG、Agent 基础）</p>
  <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
  <div id="concepts">
    <div class="concept not-started">
      <div class="num">1</div>
      <div class="info"><div class="title">Agent 核心范式</div><div class="desc">模型 + 工具 + 数据 — Agent 的本质是什么</div></div>
      <div class="score">—</div>
    </div>
    <div class="concept not-started">
      <div class="num">2</div>
      <div class="info"><div class="title">工具调用的标准化问题</div><div class="desc">为什么需要统一的协议和标准</div></div>
      <div class="score">—</div>
    </div>
    <div class="concept not-started">
      <div class="num">3</div>
      <div class="info"><div class="title">MCP：Model Context Protocol</div><div class="desc">Anthropic 提出的开放协议 — AI 的 "USB-C 接口"</div></div>
      <div class="score">—</div>
    </div>
    <div class="concept not-started">
      <div class="num">4</div>
      <div class="info"><div class="title">GPTs：OpenAI 的产品化 Agent</div><div class="desc">面向用户的可定制 AI 助手</div></div>
      <div class="score">—</div>
    </div>
    <div class="concept not-started">
      <div class="num">5</div>
      <div class="info"><div class="title">对比与生态定位</div><div class="desc">MCP vs GPTs — 协议 vs 产品</div></div>
      <div class="score">—</div>
    </div>
  </div>
</div>
</body>
</html>
