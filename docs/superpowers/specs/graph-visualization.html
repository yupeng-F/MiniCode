<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>LangGraph 编排图</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1117; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; justify-content: center; padding: 40px 20px; }
svg { max-width: 1000px; }
.node rect { stroke-width: 2; rx: 6; ry: 6; }
.node .label { font-size: 13px; fill: #e6edf3; font-weight: 600; }
.node .sub { font-size: 10px; fill: #8b949e; }
.edge line, .edge path { stroke: #30363d; stroke-width: 2; fill: none; }
.edge .cond line, .edge .cond path { stroke: #58a6ff; stroke-dasharray: 5,3; }
.edge text { font-size: 9px; fill: #8b949e; }
.arrow { fill: #30363d; }
.cond .arrow { fill: #58a6ff; }
</style>
</head>
<body>
<svg viewBox="0 0 950 750">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#30363d"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#58a6ff"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#3fb950"/></marker>
  </defs>

  <!-- START -->
  <g class="node">
    <rect x="420" y="10" width="80" height="36" fill="#0d1117" stroke="#3fb950"/>
    <text x="460" y="34" text-anchor="middle" class="label" fill="#3fb950">START</text>
  </g>
  <line x1="460" y1="46" x2="460" y2="70" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- task_intake -->
  <g class="node">
    <rect x="385" y="70" width="150" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="460" y="88" text-anchor="middle" class="label">task_intake</text>
    <text x="460" y="101" text-anchor="middle" class="sub">状态初始化</text>
  </g>
  <line x1="460" y1="110" x2="460" y2="135" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- plan_task -->
  <g class="node">
    <rect x="385" y="135" width="150" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="460" y="153" text-anchor="middle" class="label">plan_task</text>
    <text x="460" y="166" text-anchor="middle" class="sub">Planner</text>
  </g>

  <!-- conditional arrow from plan_task -->
  <line x1="460" y1="175" x2="460" y2="200" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="468" y="193" font-size="9" fill="#58a6ff">mode=plan →</text>

  <!-- repo_exploration -->
  <g class="node">
    <rect x="385" y="210" width="150" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="460" y="228" text-anchor="middle" class="label">repo_exploration</text>
    <text x="460" y="241" text-anchor="middle" class="sub">Repo Explorer</text>
  </g>

  <!-- mode=ask line going right to finalize -->
  <line x1="535" y1="230" x2="790" y2="230" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="620" y="223" font-size="9" fill="#58a6ff">mode=ask →</text>

  <!-- conditional from repo_exploration -->
  <line x1="460" y1="250" x2="460" y2="280" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="468" y="270" font-size="9" fill="#58a6ff">mode=act →</text>

  <!-- implement -->
  <g class="node">
    <rect x="385" y="290" width="150" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="460" y="308" text-anchor="middle" class="label">implement</text>
    <text x="460" y="321" text-anchor="middle" class="sub">Coder</text>
  </g>

  <!-- implement → execute_tool (request_tool) -->
  <line x1="460" y1="330" x2="280" y2="365" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="290" y="355" font-size="9" fill="#58a6ff">request_tool →</text>

  <!-- execute_tool -->
  <g class="node">
    <rect x="170" y="365" width="170" height="40" fill="#1c2128" stroke="#d29922"/>
    <text x="255" y="383" text-anchor="middle" class="label">execute_tool</text>
    <text x="255" y="396" text-anchor="middle" class="sub">ToolExecutor</text>
  </g>

  <!-- execute_tool back to implement -->
  <line x1="340" y1="385" x2="385" y2="310" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="360" y="360" font-size="9" fill="#58a6ff">agent=coder →</text>

  <!-- implement → review (handoff) -->
  <line x1="535" y1="310" x2="620" y2="365" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="552" y="340" font-size="9" fill="#58a6ff">handoff →</text>

  <!-- review -->
  <g class="node">
    <rect x="545" y="365" width="150" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="620" y="383" text-anchor="middle" class="label">review</text>
    <text x="620" y="396" text-anchor="middle" class="sub">Reviewer</text>
  </g>

  <!-- review → implement (retry) -->
  <line x1="545" y1="385" x2="535" y2="310" stroke="#f85149" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="483" y="358" font-size="9" fill="#f85149">retry(≤2次)</text>

  <!-- review → test (handoff) -->
  <line x1="620" y1="405" x2="620" y2="440" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="628" y="428" font-size="9" fill="#58a6ff">handoff →</text>

  <!-- test -->
  <g class="node">
    <rect x="545" y="450" width="150" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="620" y="468" text-anchor="middle" class="label">test</text>
    <text x="620" y="481" text-anchor="middle" class="sub">Tester</text>
  </g>

  <!-- test → implement (retry) -->
  <line x1="545" y1="470" x2="535" y2="330" stroke="#f85149" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="468" y="438" font-size="9" fill="#f85149">retry(≤2次)</text>

  <!-- test → memory_writeback (handoff) -->
  <line x1="695" y1="470" x2="770" y2="530" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="712" y="503" font-size="9" fill="#58a6ff">handoff →</text>

  <!-- test → approval_interrupt -->
  <line x1="620" y1="490" x2="460" y2="530" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="488" y="520" font-size="9" fill="#58a6ff">need_approval →</text>

  <!-- approval_interrupt -->
  <g class="node">
    <rect x="370" y="530" width="180" height="40" fill="#3d1f00" stroke="#d29922"/>
    <text x="460" y="548" text-anchor="middle" class="label">approval_interrupt</text>
    <text x="460" y="561" text-anchor="middle" class="sub">⏸ interrupt() 暂停等待</text>
  </g>

  <!-- approval → implement (approved) -->
  <line x1="370" y1="550" x2="180" y2="550" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="210" y="543" font-size="9" fill="#3fb950">approved →</text>

  <!-- approval → finalize (rejected) -->
  <line x1="370" y1="550" x2="180" y2="550" stroke="#f85149" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- memory_writeback -->
  <g class="node">
    <rect x="760" y="530" width="150" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="835" y="548" text-anchor="middle" class="label">memory_writeback</text>
    <text x="835" y="561" text-anchor="middle" class="sub">Memory Manager</text>
  </g>

  <line x1="835" y1="570" x2="835" y2="600" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- finalize -->
  <g class="node">
    <rect x="760" y="600" width="150" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="835" y="618" text-anchor="middle" class="label">finalize</text>
    <text x="835" y="631" text-anchor="middle" class="sub">组装答案</text>
  </g>

  <line x1="835" y1="640" x2="835" y2="670" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- END -->
  <g class="node">
    <rect x="795" y="670" width="80" height="36" fill="#0d1117" stroke="#3fb950"/>
    <text x="835" y="694" text-anchor="middle" class="label" fill="#3fb950">END</text>
  </g>

  <!-- plan_task → finalize (mode=plan) -->
  <line x1="535" y1="155" x2="835" y2="620" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="640" y="430" font-size="9" fill="#58a6ff">mode=plan →</text>

  <!-- finalize line to the right -->
  <g class="node">
    <rect x="385" y="620" width="150" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="460" y="638" text-anchor="middle" class="label">implement(redo)</text>
    <text x="460" y="651" text-anchor="middle" class="sub">审批通过后返回</text>
  </g>

  <!-- legend -->
  <g transform="translate(20, 685)">
    <text x="0" y="0" font-size="11" fill="#8b949e" font-weight="600">图例：</text>
    <line x1="80" y1="-4" x2="110" y2="-4" stroke="#30363d" stroke-width="2"/>
    <text x="115" y="0" font-size="10" fill="#8b949e">固定边</text>
    <line x1="170" y1="-4" x2="200" y2="-4" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="205" y="0" font-size="10" fill="#8b949e">条件边</text>
    <line x1="280" y1="-4" x2="310" y2="-4" stroke="#f85149" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="315" y="0" font-size="10" fill="#8b949e">返工边</text>
  </g>
</svg>
</body>
</html>
