# H-08: Promote Test — develop -> promote/* -> test
# Harness Engineering CICD.md

name: Promote Test

on:
  workflow_dispatch:
    inputs:
      sprints:
        description: '本次提升的 sprint id（逗号分隔，可选）'
        required: false
        type: string
      train:
        description: '是否 train 模式（聚合多个 sprint）'
        required: false
        default: 'false'
        type: string
  schedule:
    - cron: '0 17 * * 1-5'

env:
  NODE_VERSION: '20'
  HARNESS_IMAGE_REPO: ghcr.io/${{ github.repository }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  promote:
    name: Promote Develop To Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/setup-harness-scripts

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check test enabled
        id: check
        run: node scripts/env-check.mjs check test
        continue-on-error: true

      - name: Skip if disabled
        if: steps.check.outcome == 'failure'
        run: |
          echo "::notice::config/deploy.yml: test.enabled=false -> skip promote"
          exit 0

      - name: Configure git
        run: |
          git config user.name "harness-promote"
          git config user.email "harness-promote@users.noreply.github.com"

      - name: Run promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS="test"
          if [ -n "${{ inputs.sprints }}" ]; then
            ARGS="$ARGS --sprints ${{ inputs.sprints }}"
          fi
          if [ "${{ inputs.train }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --train"
          fi
          node scripts/promote.mjs $ARGS

      - name: Release lock on failure
        if: failure()
        run: |
          OWNER=$(node scripts/lock.mjs owner test || echo '')
          case "$OWNER" in
            promote-*) node scripts/lock.mjs release test --owner "$OWNER" ;;
            *) echo "::notice::test lock is not owned by promote flow" ;;
          esac
