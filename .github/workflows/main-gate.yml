# H-10: Main Branch Gate — main 只接受 release/* 或 hotfix/* 的 PR
# Harness Engineering CICD.md R5

name: Main Branch Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  main-source-gate:
    name: Main Source Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate source branch
        run: |
          HEAD_REF="${{ github.head_ref }}"
          case "$HEAD_REF" in
            release/*|hotfix/*)
              echo "allowed source branch: $HEAD_REF"
              ;;
            *)
              echo "main only accepts release/* or hotfix/* PRs"
              echo "current source branch: $HEAD_REF"
              exit 1
              ;;
          esac
